<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로아 융화제 제작 계산기</title>
    
    <meta property="og:title" content="로아 아비도스 융화제 계산기">
    <meta property="og:description" content="최적의 재료 교환 소모량을 계산하여 최대 제작 개수를 알려드립니다.">
    <meta property="og:image" content="normal_item.png">
    <meta name="theme-color" content="#e49f25">

    <style>
        :root {
            --bg-color: #1a1c23;
            --card-bg: #252831;
            --primary-color: #e49f25;
            --secondary-color: #4db3ff;
            --text-color: #e1e1e1;
            --input-bg: #12141a;
            --border-color: #3f4350;
            --accent-color: #00ff9d;
            --warning-color: #ff6b6b;
        }

        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 500px;
            border: 1px solid var(--border-color);
        }

        h2 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
        }

        .type-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 1.5rem;
        }

        .type-option {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.3s;
            gap: 8px;
        }

        .type-option.active {
            border-color: var(--primary-color);
            color: var(--primary-color);
            background: rgba(228, 159, 37, 0.1);
        }

        .type-icon {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        .input-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 1.2rem;
        }

        label {
            display: flex;
            align-items: center;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            color: #aaa;
            gap: 6px;
        }

        .item-icon {
            width: 20px;
            height: 20px;
            object-fit: contain;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: var(--input-bg);
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
        }

        input:focus {
            border-color: var(--primary-color);
        }
        
        button {
            width: 100%;
            padding: 15px;
            background-color: var(--primary-color);
            border: none;
            border-radius: 6px;
            color: #000;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 1rem;
        }

        button:hover {
            background-color: #ffb433;
        }

        .result-area {
            margin-top: 2rem;
            padding: 1.5rem;
            background-color: var(--input-bg);
            border-radius: 8px;
            text-align: center;
            border: 1px solid var(--primary-color);
        }

        .result-label {
            font-size: 1rem;
            color: #aaa;
            margin-bottom: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .result-value {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--primary-color);
        }

        .breakdown {
            margin-top: 1.5rem;
            padding: 1rem;
            background: #1e2029;
            border-radius: 8px;
            font-size: 0.85rem;
            border: 1px solid var(--border-color);
        }

        .breakdown-title {
            color: var(--accent-color);
            font-weight: bold;
            margin-bottom: 10px;
            display: block;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
        }

        .breakdown-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            color: #ccc;
        }

        .breakdown-item span:last-child {
            color: #fff;
            font-weight: bold;
        }

        .formula-box {
            font-size: 0.75rem;
            padding: 10px;
            margin-top: 15px;
            color: #777;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>제작 계산기</h2>
    
    <div class="type-selector">
        <div id="type_normal" class="type-option active" onclick="setType('normal')">
            <img src="normal_item.png" class="type-icon" alt="아비도스">
            <span>아비도스 융화제</span>
        </div>
        <div id="type_superior" class="type-option" onclick="setType('superior')">
            <img src="superior_item.png" class="type-icon" alt="상급">
            <span>상급 아비도스 융화제</span>
        </div>
    </div>

    <div class="input-grid">
        <div class="input-group">
            <label><img src="rare.png" class="item-icon"> 희귀 재료</label>
            <input type="number" id="rare" placeholder="0" min="0">
        </div>
        <div class="input-group">
            <label><img src="uncommon.png" class="item-icon"> 고급 재료</label>
            <input type="number" id="uncommon" placeholder="0" min="0">
        </div>
        <div class="input-group">
            <label><img src="common.png" class="item-icon"> 일반 재료</label>
            <input type="number" id="common" placeholder="0" min="0">
        </div>
        <div class="input-group">
            <label style="color:var(--secondary-color);"><img src="trace.png" class="item-icon"> 생활의 흔적</label>
            <input type="number" id="trace" placeholder="0" min="0">
        </div>
    </div>

    <button onclick="calculate()">최대 제작 개수 계산</button>

    <div class="result-area">
        <div class="result-label" id="result_title">
            <img id="res_img" src="normal_item.png" class="item-icon"> 
            <span id="res_text">아비도스 융화제 제작 가능 수</span>
        </div>
        <div id="result" class="result-value">0</div>
    </div>

    <div id="breakdown_area" class="breakdown" style="display:none;">
        <span class="breakdown-title">📊 재료 교환 상세 내역 (최적화)</span>
        <div class="breakdown-item"><span>일반 재료 소모량 (흔적 교환용)</span><span id="c_used">0개</span></div>
        <div class="breakdown-item"><span>고급 재료 소모량 (흔적 교환용)</span><span id="u_used">0개</span></div>
        <div class="breakdown-item"><span>교환 후 흔적 총량 (보유 포함)</span><span id="total_t">0개</span></div>
        <div class="breakdown-item"><span>희귀 재료 최종 보충량</span><span id="t_to_r" style="color:var(--accent-color);">+0개</span></div>
    </div>

    <div class="formula-box" id="info_box">
        <strong>교환 규칙:</strong><br>
        • 일반 100개 → 흔적 80개 / 고급 50개 → 흔적 80개<br>
        • 흔적 100개 → 희귀 10개
    </div>
</div>

<script>
    let currentType = 'normal';

    function setType(type) {
        currentType = type;
        document.getElementById('type_normal').classList.toggle('active', type === 'normal');
        document.getElementById('type_superior').classList.toggle('active', type === 'superior');
        
        const infoBox = document.getElementById('info_box');
        const resText = document.getElementById('res_text');
        const resImg = document.getElementById('res_img');

        if (type === 'normal') {
            resText.innerText = "아비도스 융화제 제작 가능 수";
            resImg.src = "normal_item.png";
        } else {
            resText.innerText = "상급 아비도스 융화제 제작 가능 수";
            resImg.src = "superior_item.png";
        }
        calculate();
    }

    function calculate() {
        const rareHave = parseInt(document.getElementById('rare').value) || 0;
        const traceHave = parseInt(document.getElementById('trace').value) || 0;
        const uncommonHave = parseInt(document.getElementById('uncommon').value) || 0;
        const commonHave = parseInt(document.getElementById('common').value) || 0;

        const req = currentType === 'normal' 
            ? { rare: 33, uncommon: 45, common: 86 } 
            : { rare: 43, uncommon: 59, common: 112 };

        let exchangeData = { uUsed: 0, cUsed: 0, totalT: 0, tToR: 0 };

        function canMake(targetCount) {
            const reqRare = req.rare * targetCount;
            const reqUncommon = req.uncommon * targetCount;
            const reqCommon = req.common * targetCount;

            if (uncommonHave < reqUncommon || commonHave < reqCommon) return false;

            const extraUncommon = uncommonHave - reqUncommon;
            const extraCommon = commonHave - reqCommon;

            // 소모되는 실제 재료 개수 계산
            const uUsed = Math.floor(extraUncommon / 50) * 50;
            const cUsed = Math.floor(extraCommon / 100) * 100;

            // 소모된 재료로부터 얻는 흔적 계산
            const uToT = (uUsed / 50) * 80;
            const cToT = (cUsed / 100) * 80;
            
            const totalTraces = traceHave + uToT + cToT;
            const convertedRare = Math.floor(totalTraces / 100) * 10;

            exchangeData = { uUsed, cUsed, totalT: totalTraces, tToR: convertedRare };

            return (rareHave + convertedRare) >= reqRare;
        }

        let low = 0, high = 2000000, result = 0;
        while (low <= high) {
            let mid = Math.floor((low + high) / 2);
            if (canMake(mid)) {
                result = mid;
                low = mid + 1;
            } else {
                high = mid - 1;
            }
        }

        document.getElementById('result').innerText = result.toLocaleString();
        
        if (result > 0) {
            canMake(result); 
            document.getElementById('breakdown_area').style.display = 'block';
            document.getElementById('c_used').innerText = exchangeData.cUsed.toLocaleString() + '개';
            document.getElementById('u_used').innerText = exchangeData.uUsed.toLocaleString() + '개';
            document.getElementById('total_t').innerText = exchangeData.totalT.toLocaleString() + '개';
            document.getElementById('t_to_r').innerText = '+' + exchangeData.tToR.toLocaleString() + '개';
        } else {
            document.getElementById('breakdown_area').style.display = 'none';
        }
    }
</script>

</body>
</html>
